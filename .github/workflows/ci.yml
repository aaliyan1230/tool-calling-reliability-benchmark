name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run core test suite
        # The research tests and v0.2 eval runner / HF agent modules require
        # torch at runtime or import time. Torch is only included in the
        # optional "research" extras, so those tests are excluded to keep the
        # dev-only pytest path green in CI.
        run: |
          uv run pytest \
            --ignore=tests/test_research.py \
            --ignore=tests/test_v02_eval_runner.py \
            --ignore=tests/test_v02_hf_agent.py
