[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-calling-reliability-benchmark"
version = "0.1.0"
description = "Fault-injection benchmark for tool-calling LLM orchestration policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "pytest>=8.0",
]
research = [
  "accelerate>=0.30",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
  "datasets>=2.18",
  "peft>=0.11",
  "torch>=2.2",
  "transformers>=4.41",
  "trl>=0.14",
]

[project.scripts]
tcrb = "tcrb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "local_data: requires ignored local research data under local/",
]
